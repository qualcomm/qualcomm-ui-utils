name: "Release"
env:
  IS_CI: true
  TURBO_API: "http://127.0.0.1:8585"
  TURBO_TEAM: "qualcomm-ui"
  TURBO_TOKEN: "turbo-cache-token"

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.check.outputs.should-publish }}
      base-sha: ${{ steps.base.outputs.sha }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: $/.github/actions/init-node-and-install

    # qui-changesets is consumed from the workspace and must be built first.
    - run: pnpm turbo run build --filter=@qualcomm-ui/changesets-cli

    - id: check
      run: pnpm qui-changesets check-versions

    - name: Find previous release
      id: base
      run: echo "sha=$(git rev-list -n 1 "$(git describe --tags --abbrev=0)")" >> "$GITHUB_OUTPUT"

  prepare:
    needs: check
    if: needs.check.outputs.should-publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      PREP_BRANCH: release-prep
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        # Needed to push the release-prep branch.
        persist-credentials: true

    - uses: $/.github/actions/init-node-and-install

    # Builds the CLI and the changelog formatter referenced by .changeset/config.json.
    - run: pnpm turbo run build --filter=@qualcomm-ui/changesets-cli

    - name: Prepare versions and changelogs
      env:
        BASE_SHA: ${{ needs.check.outputs.base-sha }}
        TMPDIR: ${{ runner.temp }}
      run: |
        pnpm qui-changesets changeset-generate --include-commit-links --commit-sha "$BASE_SHA"
        # changeset version exits 1 when there is nothing to release.
        if ! compgen -G '.changeset/*.md' | grep -qv '^\.changeset/README\.md$'; then
          echo 'No releasable changes since the last release.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        pnpm changeset version
        # pnpm verifies the lockfile before each script run, and CI enforces a frozen
        # lockfile. Sync it now that workspace specifiers have been bumped.
        pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
        pnpm qui-changesets consolidate-changelogs
        pnpm qui-changesets generate-release-notes

    - name: Commit and push release preparation
      id: commit
      run: |
        git add --all -- packages .changeset package.json pnpm-lock.yaml pnpm-workspace.yaml
        if git diff --cached --quiet; then
          echo 'No release changes were generated.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        git diff --cached --check
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit --signoff -m 'chore: prepare release [skip-changelog]'
        git push --force origin "HEAD:refs/heads/$PREP_BRANCH"
        echo 'pushed=true' >> "$GITHUB_OUTPUT"

    - name: Open or update release PR
      if: steps.commit.outputs.pushed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        body_file="$RUNNER_TEMP/release-pr-body.md"
        {
          printf 'Merging this PR publishes the packages. It is regenerated on every push to main.\n\n'
          printf 'Approve the generated CI runs using **Approve workflows to run**.\n\n'
          cat "$RUNNER_TEMP/release-notes.md" 2>/dev/null || true
        } > "$body_file"

        existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" \
          --base main --head "$PREP_BRANCH" --state open --json url --jq '.[0].url // empty')
        if [[ -n "$existing_pr" ]]; then
          gh pr edit "$existing_pr" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          pr_url=$existing_pr
        else
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" \
            --base main --head "$PREP_BRANCH" \
            --title 'chore: prepare release [skip-changelog]' --body-file "$body_file")
        fi
        printf 'Release PR: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: check
    if: needs.check.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - uses: $/.github/actions/init-node-and-install

    - name: build
      run: pnpm run build

    - run: npm --version

    - name: publish
      run: pnpm changeset publish

    - name: create releases
      run: pnpm qui-changesets create-github-releases --token $TOKEN
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
